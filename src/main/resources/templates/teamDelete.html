<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" type="text/css" th:href="@{/style.css}">
	<title th:text="team削除確認"></title>
</head>
<body>
	<div th:text="team削除確認" class="title"></div>
	<div th:object="${team}">
		<p>
			次のデータを削除してよろしいですか？
		</p>
		<p th:text="*{'teamid: ' + teamid}"></p>
		<p th:text="*{'teamname: ' + teamname}"></p>
		<p th:text="*{'country: ' + country}"></p>
		<form th:action="@{/teamRemove}" method="post">
			<input type="hidden" th:field="*{teamid}" />
			<input type="submit" value="削除" />
		</form>
	</div>
	<p><a th:href="@{/teamList}">teamListへ戻る</a></p>
	
</body>
</html>
