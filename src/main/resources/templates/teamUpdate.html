<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title th:text="team更新"></title>
	<link rel="stylesheet" type="text/css" th:href="@{/style.css}" >
</head>
<body>
	<div th:text="team更新" class="title"></div>
	<form th:action="@{/teamInsert}" th:object="${team}" method="post">		
		<p>
			teamname
			<input type="text" th:field="*{teamname}" />
		</p>
		<p>
			country
			<input type="text" th:field="*{country}" />
		</p>
		<input type="hidden" th:field="*{teamid}">
		<input type="submit" value="送信">
	</form>
	
	<p><a th:href="@{/teamList}">teamListへ戻る</a></p>
	
</body>
</html>
