<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title th:text="delivery"></title>
	<link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
	<div th:text="delivery" class="title"></div>
	
	<!--206/06/21-->
	<p><a th:href="@{/delivery/{x}/{y}(x=${a},y=${b})}">値の受け渡し</a></p>
	<p><button type="button" th:onclick="|location.href='/delivery/__${a}__/__${b}__'|">値の受け渡し</button></p>
	<p><input type="button" th:onclick="|location.href='/delivery/__${a}__/__${b}__'|" value="値の受け渡し"></p>
	<p th:text="'a=' + ${a}"></p>
	<p th:text="'b=' + ${b}"></p>
<!--	<p><input type="button" value="値の受け渡し（ボタン）">値の受け渡し（ボタン）</p>-->
	
	<hr>
	<p><a th:href="@{/top}">トップへ戻る</a></p>
	
</body>
</html>
